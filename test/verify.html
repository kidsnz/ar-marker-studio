<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>検算 — AR Marker Studio</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .ok { color: var(--good); }
  .ng { color: var(--bad); }
  pre { white-space: pre-wrap; line-height: 1.9; margin: 0; }
</style>
</head>
<body>

<header>
  <h1>検算</h1>
  <p class="lead">このページの計算結果が、<strong>本物の生成器の出力と一致するか</strong>を確かめる。<br>
     期待値は NFT-Marker-Creator を実際に走らせて、そのログから取った実測値
     （<code>test/fixtures.js</code>）。</p>
</header>

<main>
<section>
  <h2>使い方</h2>
  <p>マーカーの元画像が入ったフォルダを選ぶ。
     <a href="https://github.com/kidsnz/ar-marker-studio#検算">README</a> の手順どおりなら
     <code>projects/atariar/markers</code> を選べばよい。</p>
  <p class="row">
    <input type="file" id="dir" webkitdirectory directory multiple>
    <button type="button" id="run" class="primary" disabled>検算する</button>
  </p>
  <p class="hint">画像はブラウザの外に出ない。全部この場で計算する。</p>
</section>

<section>
  <h2>結果</h2>
  <pre id="out">フォルダを選ぶと始められる。</pre>
</section>
</main>

<footer><p><a href="../">← ツールに戻る</a></p></footer>

<script src="../js/png.js"></script>
<script src="../js/engine.js"></script>
<script src="fixtures.js"></script>
<script>
(function () {
  'use strict';
  var files = {};
  var out = document.getElementById('out');

  document.getElementById('dir').addEventListener('change', function (e) {
    files = {};
    Array.prototype.forEach.call(e.target.files, function (f) {
      // "…/markers/edo/01.png" の末尾2階層で照合する
      var parts = (f.webkitRelativePath || f.name).split('/');
      files[parts.slice(-2).join('/')] = f;
    });
    document.getElementById('run').disabled = false;
    out.textContent = Object.keys(files).length + ' 個のファイルを読み込んだ。「検算する」を押す。';
  });

  document.getElementById('run').addEventListener('click', function () {
    document.getElementById('run').disabled = true;
    out.textContent = '';
    run().then(function () { document.getElementById('run').disabled = false; });
  });

  function log(s, cls) {
    var span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = s + '\n';
    out.appendChild(span);
  }

  function pad(s, n) { while (s.length < n) s += ' '; return s; }

  async function runCases(cases, tol) {
    var bad = 0;
    for (var i = 0; i < cases.length; i++) {
      var c = cases[i];
      var f = files[c.image];
      if (!f) { log('  --  ' + c.image + ' が選んだフォルダに無い'); bad++; continue; }

      log('  ..  ' + pad(c.image, 30) + ' 計算中…');
      var last = out.lastChild;
      await new Promise(function (r) { setTimeout(r, 10); });   // 画面を更新させる

      var png = await PNGReader.decode(await f.arrayBuffer());
      var bw = Engine.toBW(png.data, png.width, png.height).bw;
      var res = Engine.predict(bw, png.width, png.height, { dpi: c.dpi, level: c.level });
      var got = res.bands.map(function (b) { return b.points.length; });
      var gc = [res.bands[0].extracted, res.bands[0].filtered];

      var ok = got.length === c.points.length && got.every(function (g, j) {
        return tol === 0 ? g === c.points[j]
                         : Math.abs(g - c.points[j]) <= Math.max(1, c.points[j] * tol);
      });
      var okc = gc[0] === c.counts[0] && gc[1] === c.counts[1];
      if (!ok || !okc) bad++;

      out.removeChild(last);
      log('  ' + (ok && okc ? 'OK ' : 'NG ') + pad(c.image, 30)
        + ' -dpi=' + c.dpi + ' -level=' + c.level + '  候補 ' + gc[0] + '/' + gc[1]
        + (tol ? '  （許容 ' + tol * 100 + '%）' : ''), ok && okc ? 'ok' : 'ng');
      if (!ok) {
        log('        予測 [' + got + ']', 'ng');
        log('        実際 [' + c.points + ']', 'ng');
      }
      if (!okc) log('        NG 候補数 [' + gc + '] / 実際 [' + c.counts + ']', 'ng');
    }
    return bad;
  }

  async function run() {
    log('[1] コントラストのある絵（完全一致を要求する）');
    var bad = await runCases(Fixtures.EXACT, 0);
    log('[2] のっぺりした絵（生成器側の float32 の丸めでずれる既知のケース）');
    bad += await runCases(Fixtures.TOLERANT, Fixtures.TOLERANCE);
    log('');
    log('判定: ' + (bad === 0 ? 'すべて合格' : '不合格（' + bad + ' 件）'),
        bad === 0 ? 'ok' : 'ng');
  }
})();
</script>
</body>
</html>
